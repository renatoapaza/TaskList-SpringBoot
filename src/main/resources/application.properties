spring.application.name=tasklist

# Configuraci\u00f3n de base de datos
spring.datasource.url=jdbc:mysql://localhost:3306/task_list?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=admin
spring.datasource.password=admin

# JPA y Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
# Hace que Hibernate muestre en la consola todos los comandos SQL que ejecuta tu aplicaci\u00f3n a trav\u00e9s de JPA.
spring.jpa.show-sql=true

#H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console


